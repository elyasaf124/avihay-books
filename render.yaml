# פריסת Docker ב־https://render.com
# חובה: plan: free — בלי זה ברירת המחדל היא starter (בתשלום) ו־Render יבקש כרטיס אשראי.
# ריפו private: תוכנית free לא תמיד זמינה — שקול ריפו public או תוכנית בתשלום (ראה תיעוד Render).

services:
  - type: web
    name: avihay-books-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: RUN_SEED_ON_START
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: APP_API_KEY
        sync: false
