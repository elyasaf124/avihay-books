# פריסת `Docker` ב־https://render.com (שכבת `Web Service` בתוכנית `Free`; עשוי להיכנס למצב רדום).
# `PostgreSQL` חינמי: צור פרויקט ב־https://neon.tech הדבק את `DATABASE_URL` כמשתנה סודי בשירות הרשת למטה.
#
# לאחר ההעלאה: Render מספק `URL` בסגנון https://avihay-books-api.onrender.com
# בסיס האפליקציה בהגדרות הטלפון: EXPO_PUBLIC_API_BASE_URL=https://<שם>-...onrender.com/api/v1

services:
  - type: web
    name: avihay-books-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: RUN_SEED_ON_START
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: APP_API_KEY
        sync: false
