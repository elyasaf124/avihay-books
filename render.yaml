# פריסת Docker ב־https://render.com
# חובה: plan: free — בלי זה ברירת המחדל היא starter (בתשלום) ו־Render יבקש כרטיס אשראי.
#
# ⚠️ בוט וואטסאפ: ה-webhook חייב אירוח always-on. תוכנית `free` נרדמת ותחמיץ/תעכב הודעות.
# לפני הפעלת הבוט בפרודקשן — שנה `plan: free` ל-`plan: starter` (או מארח always-on אחר)
# והוסף ל-Environment את משתני WHATSAPP_* (ראה backend/.env.example, sync: false).
#
# ─── region ───────────────────────────────────────────────────────────────────
# ה-Postgres ב-Neon יושב ב-`aws-eu-central-1` (פרנקפורט). כשה-API היה ב-`oregon`
# כל round trip ל-DB חצה יבשת ואוקיינוס (~150ms במקום ~2-5ms).
# Render לא מאפשר לשנות `region` לשירות קיים — צריך ליצור שירות חדש.
# ⚠️ ה-URL של השירות החדש שונה, ולכן צריך גם:
#   1. לעדכן `EXPO_PUBLIC_API_BASE_URL` ב-`mobile/.env.production` ולבנות APK מחדש.
#   2. לעדכן את כתובת ה-webhook של WhatsApp ב-Meta.
#   3. להעתיק ידנית את כל משתני ה-Environment מהשירות הישן (כולל WHATSAPP_*).
# שווה לחבר custom domain בהזדמנות הזאת, כדי שהעברה הבאה לא תדרוש build נוסף.

services:
  - type: web
    name: avihay-books-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: RUN_SEED_ON_START
        value: "false"
      # חשוב: ה-host חייב להיות ה-**pooled** של Neon (`...-pooler...`).
      # ה-API מדפיס בעלייה `[db] connection target` עם `pooled: true/false` לאימות.
      - key: DATABASE_URL
        sync: false
      # `sync: false` ולא `generateValue: true` — שירות חדש עם מפתח חדש יחזיר 401
      # לכל אפליקציה שכבר מותקנת. יש להעתיק את אותו ערך מהשירות הקיים.
      - key: APP_API_KEY
        sync: false
      # WhatsApp bot — ערכים ידניים ב-Render Dashboard → Environment (sync: false)
      - key: WHATSAPP_ENABLED
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
